# Makes the Icelandic audio clips (audio/*.mp3) with make_audio.py and commits them.
# Runs when make_audio.py changes, or by hand from the Actions tab.
# Clips that already exist are kept, so your own recordings are never overwritten.
name: Búa til hljóðskrár
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [make_audio.py, .github/workflows/audio.yml]
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests edge-tts
      - run: python make_audio.py
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Hljóðskrár búnar til með make_audio.py" && git push)
